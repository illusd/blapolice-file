<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>巴拉國法律與處罰全文 | BalaPolice</title>
</head>
<body>
<pre id="out">載入中…</pre>
<script src="laws-meta.js"></script>
<script src="laws-statutes-a1.js"></script>
<script src="laws-statutes-a2.js"></script>
<script src="laws-statutes-a.js"></script>
<script src="laws-statutes-b.js"></script>
<script src="laws-statutes.js"></script>
<script src="laws-penalties-a.js"></script>
<script src="laws-penalties-b.js"></script>
<script src="laws-penalties.js"></script>
<script src="laws-data.js"></script>
<script>
(function(){
  var d = window.BALA_LAWS;
  var lines = [];
  if (!d) { document.getElementById('out').textContent = '無法載入法律資料'; return; }
  lines.push('巴拉國法律與處罰全文 | BalaPolice');
  lines.push('');
  lines.push(new Array(73).join('='));
  lines.push('貨幣：' + (d.currency || ''));
  lines.push('聲明：' + (d.notice || ''));
  lines.push(new Array(73).join('='));
  lines.push('');
  lines.push('【一、法律條文全文】');
  lines.push('');
  (d.statutes || []).forEach(function(s){
    lines.push(new Array(73).join('-'));
    lines.push(s.code + ' — ' + s.title);
    lines.push('生效：' + s.enacted);
    lines.push('前言：' + s.preamble);
    lines.push('');
    (s.chapters || []).forEach(function(ch){
      lines.push('  ' + ch.name);
      (ch.articles || []).forEach(function(a){
        lines.push('    第' + a.no + '條　' + a.text);
      });
      lines.push('');
    });
    lines.push('');
  });
  lines.push(new Array(73).join('='));
  lines.push('【二、處罰內容全文】');
  lines.push('');
  lines.push('說明：巴拉國不設死刑。累犯／再犯：五年內再犯得加重本刑至二分之一；假釋／緩刑中再犯，撤銷。');
  lines.push('無期徒刑：故意殺人、放火致死、強盜殺人、重大貪污等得處無期徒刑。');
  lines.push('');
  (d.penalties || []).forEach(function(p){
    lines.push(new Array(73).join('-'));
    lines.push(p.statuteTitle + '（' + p.statuteId + '）');
    lines.push('');
    (p.items || []).forEach(function(item){
      lines.push('  罪名：' + item.offence);
      lines.push('  條文：' + item.article);
      lines.push('  主刑／主要處罰：' + item.principal);
      if (item.additional) lines.push('  附加／其他：' + item.additional);
      if (item.juvenile) lines.push('  少年／兒童：' + item.juvenile);
      lines.push('');
    });
    lines.push('');
  });
  lines.push(new Array(73).join('='));
  var arts = 0;
  (d.statutes || []).forEach(function(s){ (s.chapters||[]).forEach(function(ch){ arts += (ch.articles||[]).length; }); });
  var items = 0;
  (d.penalties || []).forEach(function(p){ items += (p.items||[]).length; });
  lines.push('統計：' + (d.statutes||[]).length + ' 部法律、' + arts + ' 條條文、' + (d.penalties||[]).length + ' 組處罰、' + items + ' 項處罰項目。');
  lines.push('巴拉國警察局 BalaPolice · 完整公開文本');
  document.getElementById('out').textContent = lines.join('\n');
})();
</script>
</body>
</html>
